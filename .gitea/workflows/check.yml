name: 提交检查

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: 格式、测试与跨平台编译
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      GOFLAGS: -mod=readonly
      GOTOOLCHAIN: local
    steps:
      - name: 检出代码
        uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: 安装系统依赖
        run: |
          # The rootless runner cannot switch to APT's _apt UID/GID.
          # Its image-owned _apt cache is inaccessible too; use this job's directory.
          burrow_apt_cache="$RUNNER_TEMP/burrow-apt-archives"
          mkdir -p "$burrow_apt_cache/partial"
          apt-get -o APT::Sandbox::User=root -o "Dir::Cache::archives=$burrow_apt_cache" update
          apt-get -o APT::Sandbox::User=root -o "Dir::Cache::archives=$burrow_apt_cache" install -y --no-install-recommends build-essential ca-certificates curl

      - name: 准备项目工具链
        uses: https://github.com/jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5
        with:
          version: 2026.10.25
          cache: false
          # A Gitea job token must not be sent to GitHub's download API.
          github_token: ''

      - name: 检查 Go 格式
        run: |
          # pkg-sftp retains upstream formatting; check app code and the terminal fork.
          unformatted="$(git ls-files -z -- '*.go' ':!:third_party/pkg-sftp/**' | xargs -0 gofmt -l)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: 检查 Python 脚本语法
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path

          for source in Path("scripts").glob("*.py"):
              ast.parse(source.read_text(encoding="utf-8"), filename=str(source))
          PY

      - name: 检查主模块
        run: |
          go mod verify
          go vet ./...
          go test -race -timeout=10m ./...
          go build ./...

      - name: 检查本地扩展模块
        run: |
          go -C third_party/mygo-terminal vet ./...
          go -C third_party/mygo-terminal test -race -timeout=10m ./...
          # Upstream packet ReadFrom methods intentionally differ from io.ReaderFrom.
          go -C third_party/pkg-sftp vet -stdmethods=false ./...

      - name: 检查 Windows 双架构编译
        run: |
          for arch in amd64 arm64; do
            GOOS=windows GOARCH="$arch" CGO_ENABLED=0 go vet ./...
            GOOS=windows GOARCH="$arch" CGO_ENABLED=0 go build ./...
          done

      - name: 确认依赖文件未被改写
        run: |
          git diff --exit-code -- go.mod go.sum third_party/mygo-terminal/go.mod third_party/mygo-terminal/go.sum third_party/pkg-sftp/go.mod third_party/pkg-sftp/go.sum
