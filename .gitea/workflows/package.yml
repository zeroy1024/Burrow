name: 编译打包

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows 双架构安装包与便携包
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      GOFLAGS: -mod=readonly
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
    steps:
      - name: 检出代码
        uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: 安装打包依赖
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl nsis

      - name: 准备项目工具链
        uses: https://github.com/jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5
        with:
          version: 2026.10.25
          cache: false
          github_token: ''

      - name: 构建 Windows 产物
        run: mise run build -- --platform windows/amd64,windows/arm64

      - name: 校验安装包、便携包与摘要
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import zipfile

          config = json.loads(Path("mygo.json").read_text(encoding="utf-8"))
          for arch in ("amd64", "arm64"):
              output = Path(config["out"]) / f"windows-{arch}"
              installer = output / f"{config['slug']}-setup-{config['version']}-{arch}.exe"
              portable = output / f"{config['slug']}-{config['version']}-windows-{arch}.zip"
              for artifact in (installer, portable):
                  if not artifact.is_file() or artifact.stat().st_size == 0:
                      raise SystemExit(f"Missing or empty artifact: {artifact}")
              with zipfile.ZipFile(portable) as archive:
                  bad = archive.testzip()
                  if bad is not None:
                      raise SystemExit(f"Corrupt ZIP member: {bad}")
                  for filename in (f"{config['name']}.exe", "ghostty-vt.dll"):
                      if archive.read(f"{config['name']}/{filename}") != (output / filename).read_bytes():
                          raise SystemExit(f"Packaged runtime differs: {filename}")
              checksums = []
              for artifact in (installer, portable):
                  digest = hashlib.sha256(artifact.read_bytes()).hexdigest()
                  checksums.append(f"{digest}  {artifact.name}\n")
              (output / "SHA256SUMS").write_text("".join(checksums), encoding="utf-8")
          PY

      - name: 保存 Windows x64 产物
        uses: https://github.com/actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: burrow-windows-amd64
          path: |
            build/windows-amd64/*-setup-*.exe
            build/windows-amd64/*.zip
            build/windows-amd64/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: 保存 Windows ARM64 产物
        uses: https://github.com/actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: burrow-windows-arm64
          path: |
            build/windows-arm64/*-setup-*.exe
            build/windows-arm64/*.zip
            build/windows-arm64/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
