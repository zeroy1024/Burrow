name: 提交检查

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: 格式、测试与跨平台编译
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      GOFLAGS: -mod=readonly
      GOTOOLCHAIN: local
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential ca-certificates curl

      - name: 扫描当前文件与 Git 历史
        run: |
          burrow_gitleaks_archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --output "$burrow_gitleaks_archive" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$burrow_gitleaks_archive" | sha256sum --check --strict
          tar -xzf "$burrow_gitleaks_archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --log-opts='--all --full-history' --redact=100 --no-banner .
          "$RUNNER_TEMP/gitleaks" dir --redact=100 --no-banner .

      - name: 准备项目工具链
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5
        with:
          version: 2026.10.25
          cache: false

      - name: 检查 Go 格式
        run: |
          # pkg-sftp retains upstream formatting; check app code and the terminal fork.
          unformatted="$(git ls-files -z -- '*.go' ':!:third_party/pkg-sftp/**' | xargs -0 gofmt -l)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: 检查 Python 脚本语法
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path

          for source in Path("scripts").glob("*.py"):
              ast.parse(source.read_text(encoding="utf-8"), filename=str(source))
          PY

      - name: 检查第三方许可汇总
        run: python3 scripts/licenses.py --check

      - name: 检查主模块
        run: |
          go mod verify
          go vet ./...
          go test -race -timeout=10m ./...
          go build ./...

      - name: 检查本地扩展模块
        run: |
          go -C third_party/mygo-terminal vet ./...
          go -C third_party/mygo-terminal test -race -timeout=10m ./...
          # Upstream packet ReadFrom methods intentionally differ from io.ReaderFrom.
          go -C third_party/pkg-sftp vet -stdmethods=false ./...

      - name: 检查 Windows 双架构编译
        run: |
          for arch in amd64 arm64; do
            GOOS=windows GOARCH="$arch" CGO_ENABLED=0 go vet ./...
            GOOS=windows GOARCH="$arch" CGO_ENABLED=0 go build ./...
          done

      - name: 确认依赖文件未被改写
        run: |
          git diff --exit-code -- go.mod go.sum third_party/mygo-terminal/go.mod third_party/mygo-terminal/go.sum third_party/pkg-sftp/go.mod third_party/pkg-sftp/go.sum
