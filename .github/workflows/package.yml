name: 编译打包与发布草稿
run-name: 打包 ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的版本标签，例如 v0.1.2
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: package-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  BURROW_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  windows:
    name: Windows 双架构安装程序
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      GOFLAGS: -mod=readonly
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: 安装打包依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates nsis 7zip

      - name: 核对版本标签与许可
        run: |
          python3 - <<'PYTAG'
          import json
          import os
          from pathlib import Path

          version = json.loads(Path("mygo.json").read_text(encoding="utf-8"))["version"]
          if os.environ["BURROW_RELEASE_TAG"] != f"v{version}":
              raise SystemExit("Tag must match the version in mygo.json")
          PYTAG
          python3 scripts/licenses.py --check

      - name: 准备项目工具链
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5
        with:
          version: 2026.10.25
          cache: false

      - name: 构建 Windows 产物
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          : "${MYGO_UPDATER_PRIVATE_KEY:?Configure the MYGO_UPDATER_PRIVATE_KEY repository secret}"
          mise run build -- --platform windows/amd64,windows/arm64

      - name: 校验安装程序内容与更新文件
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import tempfile

          config = json.loads(Path("mygo.json").read_text(encoding="utf-8"))
          for arch in ("amd64", "arm64"):
              output = Path(config["out"]) / f"windows-{arch}"
              installer = output / f"{config['slug']}-setup-{config['version']}-{arch}.exe"
              if not installer.is_file() or installer.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty installer: {installer}")
              with tempfile.TemporaryDirectory(prefix=f"burrow-installer-{arch}-") as directory:
                  subprocess.run(["7z", "x", "-y", f"-o{directory}", str(installer)], check=True)
                  for filename in (f"{config['name']}.exe", "ghostty-vt.dll", "LICENSE", "THIRD_PARTY_NOTICES.md"):
                      if (Path(directory) / filename).read_bytes() != (output / filename).read_bytes():
                          raise SystemExit(f"Installed runtime differs: {filename}")
              manifest = json.loads((output / f"update-windows-{arch}.json").read_text(encoding="utf-8"))
              archive = output / manifest["url"].rsplit("/", 1)[1]
              if manifest["version"] != config["version"] or archive.stat().st_size != manifest["size"]:
                  raise SystemExit(f"Update manifest differs from the build: windows-{arch}")
          PY

      - name: 保存 Windows 产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: burrow-windows
          path: |
            build/windows-*/*-setup-*.exe
            build/windows-*/*.tar.gz
            build/windows-*/*.delta
            build/windows-*/update-*.json
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS ARM64 DMG
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      GOFLAGS: -mod=readonly
      GOTOOLCHAIN: local
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: 核对版本标签与许可
        run: |
          python3 - <<'PYTAG'
          import json
          import os
          from pathlib import Path

          version = json.loads(Path("mygo.json").read_text(encoding="utf-8"))["version"]
          if os.environ["BURROW_RELEASE_TAG"] != f"v{version}":
              raise SystemExit("Tag must match the version in mygo.json")
          PYTAG
          python3 scripts/licenses.py --check

      - name: 导入固定签名身份
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          : "${MACOS_CERTIFICATE_BASE64:?Configure the MACOS_CERTIFICATE_BASE64 repository secret}"
          : "${MACOS_CERTIFICATE_PASSWORD:?Configure the MACOS_CERTIFICATE_PASSWORD repository secret}"
          umask 077
          burrow_certificate="$RUNNER_TEMP/burrow-signing.p12"
          burrow_keychain="$RUNNER_TEMP/burrow-signing.keychain-db"
          burrow_keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$burrow_keychain_password"
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$burrow_certificate"
          security create-keychain -p "$burrow_keychain_password" "$burrow_keychain"
          security set-keychain-settings -lut 21600 "$burrow_keychain"
          security unlock-keychain -p "$burrow_keychain_password" "$burrow_keychain"
          security import "$burrow_certificate" -k "$burrow_keychain" \
            -f pkcs12 -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$burrow_keychain_password" "$burrow_keychain"
          security list-keychains -d user -s "$burrow_keychain"
          security default-keychain -d user -s "$burrow_keychain"
          python3 scripts/setup-macos-signing.py --check

      - name: 准备项目工具链
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5
        with:
          version: 2026.10.25
          cache: false

      - name: 构建 macOS DMG
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          : "${MYGO_UPDATER_PRIVATE_KEY:?Configure the MYGO_UPDATER_PRIVATE_KEY repository secret}"
          mise run build -- --platform darwin/arm64

      - name: 校验 DMG 与更新文件
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess

          config = json.loads(Path("mygo.json").read_text(encoding="utf-8"))
          output = Path(config["out"]) / "darwin-arm64"
          resources = output / f"{config['name']}.app" / "Contents" / "Resources"
          for filename in ("LICENSE", "THIRD_PARTY_NOTICES.md"):
              if (resources / filename).read_bytes() != Path(filename).read_bytes():
                  raise SystemExit(f"Bundled license differs: {filename}")
          dmg = output / f"{config['slug']}-{config['version']}-arm64.dmg"
          if not dmg.is_file() or dmg.stat().st_size == 0:
              raise SystemExit(f"Missing or empty DMG: {dmg}")
          subprocess.run(["hdiutil", "verify", str(dmg)], check=True)
          manifest = json.loads((output / "update-darwin-arm64.json").read_text(encoding="utf-8"))
          archive = output / manifest["url"].rsplit("/", 1)[1]
          if manifest["version"] != config["version"] or archive.stat().st_size != manifest["size"]:
              raise SystemExit("Update manifest differs from the build: darwin-arm64")
          PY

      - name: 保存 macOS 产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: burrow-macos
          path: |
            build/darwin-arm64/*.dmg
            build/darwin-arm64/*.tar.gz
            build/darwin-arm64/*.delta
            build/darwin-arm64/update-*.json
          if-no-files-found: error
          retention-days: 14

  release:
    name: 汇总产物并上传 Release 草稿
    needs: [windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 下载本次运行的产物
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/artifacts"
          mkdir "$RUNNER_TEMP/release"
          find "$RUNNER_TEMP/artifacts" -type f -exec mv -t "$RUNNER_TEMP/release" {} +

      - name: 核对产物并生成摘要
        working-directory: ${{ runner.temp }}/release
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          version = os.environ["BURROW_RELEASE_TAG"].removeprefix("v")
          expected = [f"burrow-{version}-arm64.dmg", f"burrow-setup-{version}-amd64.exe", f"burrow-setup-{version}-arm64.exe"]
          for target in ("darwin-arm64", "windows-amd64", "windows-arm64"):
              manifest = json.loads(Path(f"update-{target}.json").read_text(encoding="utf-8"))
              if manifest["version"] != version:
                  raise SystemExit(f"Update manifest version differs from the tag: {target}")
              expected.append(manifest["url"].rsplit("/", 1)[1])
              expected.extend(delta["url"].rsplit("/", 1)[1] for delta in manifest.get("deltas", []))
          published = sorted(path.name for path in Path(".").iterdir() if not path.name.startswith("update-"))
          if published != sorted(expected):
              raise SystemExit(f"Release files differ from the manifests: {published}")
          Path("SHA256SUMS").write_text(
              "".join(f"{hashlib.sha256(Path(name).read_bytes()).hexdigest()}  {name}\n" for name in published),
              encoding="utf-8",
          )
          Path(os.environ["RUNNER_TEMP"], "notes.md").write_text(manifest["notes"] + "\n", encoding="utf-8")
          PY

      - name: 上传到 Release 草稿
        working-directory: ${{ runner.temp }}/release
        run: |
          # Published assets are what installed apps verify; never replace them.
          burrow_release_draft="$(gh release view "$BURROW_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo missing)"
          case "$burrow_release_draft" in
            missing)
              gh release create "$BURROW_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft --prerelease --verify-tag \
                --title "Burrow ${BURROW_RELEASE_TAG#v} Preview" --notes-file "$RUNNER_TEMP/notes.md"
              ;;
            true) ;;
            *) echo "Release $BURROW_RELEASE_TAG is already published" >&2; exit 1 ;;
          esac
          shopt -s extglob
          gh release upload "$BURROW_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber -- !(update-*.json)
          # Manifests last: apps must never see a manifest whose files are missing.
          gh release upload "$BURROW_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber -- update-*.json
